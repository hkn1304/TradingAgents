<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradingAgents">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.svg">
<title>TradingAgents</title>
<style>
/* ── Reset + variables ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --bg3:     #1f2937;
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --bull:    #3fb950;
  --bear:    #f85149;
  --neutral: #d29922;
  --accent:  #58a6ff;
  --header-h: 56px;
  --tabbar-h: 56px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  overflow: hidden;
}

/* ── Header ───────────────────────────────────────────────────────────────── */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--header-h);
  padding-top: env(safe-area-inset-top);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 12px; padding-right: 12px; gap: 8px;
}
.logo {
  font-weight: 900; font-size: 15px; color: var(--accent);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 7px; white-space: nowrap; flex-shrink: 0;
}
.ticker-wrap {
  display: flex; align-items: center; gap: 6px; flex: 1; max-width: 240px;
}
.ticker-wrap input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 6px 10px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
  outline: none; text-transform: uppercase;
}
.ticker-wrap input:focus { border-color: var(--accent); }
.ticker-wrap button {
  background: var(--accent); color: #0d1117;
  border: none; border-radius: 8px; padding: 6px 12px;
  font-weight: 700; font-size: 13px; cursor: pointer; flex-shrink: 0;
}
.header-right {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.asset-badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  border: 1px solid var(--border); color: var(--muted); background: var(--bg3);
  text-transform: uppercase;
}
.last-update { font-size: 10px; color: var(--muted); white-space: nowrap; }

/* ── Scrollable main area ─────────────────────────────────────────────────── */
main {
  position: fixed;
  top: var(--header-h);
  bottom: var(--tabbar-h);
  left: 0; right: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-content { display: none; padding-bottom: 16px; }
.tab-content.active { display: block; }

/* ── Bottom tab bar ───────────────────────────────────────────────────────── */
nav.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--tabbar-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg2); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr 1fr;
}
.tab-btn {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; cursor: pointer;
  font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
  transition: color .15s;
}
.tab-btn svg { width: 20px; height: 20px; }
.tab-btn.active { color: var(--accent); }

/* ── Card ─────────────────────────────────────────────────────────────────── */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; margin: 10px 10px 0; padding: 14px 16px;
}
.card-title {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
}

/* ── Price hero ───────────────────────────────────────────────────────────── */
.price-row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.price-main { font-size: 36px; font-weight: 800; line-height: 1; }
.price-badge {
  font-size: 14px; font-weight: 700; padding: 3px 8px;
  border-radius: 6px; line-height: 1.4;
}
.price-badge.bull { background: rgba(63,185,80,.15); color: var(--bull); }
.price-badge.bear { background: rgba(248,81,73,.15);  color: var(--bear); }
.price-badge.flat { background: rgba(139,148,158,.15); color: var(--muted); }
.price-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.price-loading { font-size: 11px; color: var(--muted); font-style: italic; }

/* ── TradingView chart ────────────────────────────────────────────────────── */
.chart-card { padding: 0; overflow: hidden; }
.chart-controls {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
}
.chart-label { font-size: 11px; color: var(--muted); }
.chart-btn {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; padding: 3px 8px;
  border-radius: 6px; cursor: pointer;
}
#tv-chart { width: 100%; height: 380px; border: none; display: block; }

/* ── Pivot table ──────────────────────────────────────────────────────────── */
.pivot-table { width: 100%; border-collapse: collapse; }
.pivot-table tr { border-bottom: 1px solid var(--border); }
.pivot-table tr:last-child { border-bottom: none; }
.pivot-table td { padding: 7px 2px; font-size: 13px; }
.pivot-lbl { font-weight: 700; width: 38px; }
.pivot-bar-cell { width: 100%; padding: 0 8px; }
.pivot-bar-wrap {
  position: relative; height: 5px; background: var(--bg3);
  border-radius: 3px; overflow: hidden;
}
.pivot-bar-fill { height: 100%; border-radius: 3px; }
.pivot-price {
  text-align: right; font-weight: 600; font-size: 13px;
  white-space: nowrap; padding-left: 8px; min-width: 64px;
}
.pivot-now td { background: rgba(88,166,255,.07); }

/* ── Indicators grid ──────────────────────────────────────────────────────── */
.ind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ind-box { background: var(--bg3); border-radius: 8px; padding: 10px; }
.ind-name { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.ind-value { font-size: 20px; font-weight: 700; }
.ind-signal { font-size: 10px; margin-top: 2px; }
.bull-c { color: var(--bull); }
.bear-c { color: var(--bear); }
.neutral-c { color: var(--neutral); }

/* ── News ─────────────────────────────────────────────────────────────────── */
.news-item {
  display: block; padding: 9px 0; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit;
}
.news-item:last-child { border-bottom: none; }
.news-item:active { opacity: .7; }
.news-title { font-size: 13px; line-height: 1.4; margin-bottom: 3px; }
.news-meta { font-size: 11px; color: var(--muted); }
.news-meta span { margin-right: 8px; }

/* ── Loading / error states ───────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px; height: 16px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.error-msg {
  color: var(--bear); font-size: 12px; padding: 8px 0;
  display: flex; align-items: center; gap: 6px;
}

/* ── Tab 3 placeholder ────────────────────────────────────────────────────── */
.placeholder-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 24px; text-align: center; gap: 12px;
}
.placeholder-wrap svg { width: 48px; height: 48px; color: var(--muted); opacity: .4; }
.placeholder-title { font-size: 18px; font-weight: 700; color: var(--text); }
.placeholder-sub { font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 280px; }
.placeholder-badge {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--accent); color: var(--accent);
  text-transform: uppercase; letter-spacing: 1px;
}

/* ── Tab 2: Agents ────────────────────────────────────────────────────────── */
.agent-form { display: flex; flex-direction: column; gap: 10px; }

.date-row { display: flex; gap: 8px; align-items: center; }
.date-row label { font-size: 11px; color: var(--muted); white-space: nowrap; }
.date-row input[type=date] {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none;
  flex: 1;
}
.date-row input[type=date]:focus { border-color: var(--accent); }

.tier-header {
  font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center;
}
.tier-badge {
  font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.tier1-badge { background: rgba(88,166,255,.15); color: var(--accent); border: 1px solid var(--accent); }
.tier2-badge { background: rgba(139,148,158,.1);  color: var(--muted);  border: 1px solid var(--border); }

.agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.agent-chip {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; transition: border-color .15s, background .15s;
  user-select: none;
}
.agent-chip:hover { border-color: var(--accent); }
.agent-chip.selected { border-color: var(--accent); background: rgba(88,166,255,.1); }
.agent-chip.disabled { opacity: .4; cursor: not-allowed; }
.agent-chip input[type=checkbox] { display: none; }
.agent-chip-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.agent-chip-label { font-size: 12px; font-weight: 600; line-height: 1.3; }
.agent-chip-sub   { font-size: 10px; color: var(--muted); }

.run-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: #0d1117;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.run-btn:disabled { opacity: .4; cursor: not-allowed; }
.run-btn:active:not(:disabled) { opacity: .8; }

/* Agent output cards */
.agent-run-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; margin: 10px 10px 0; overflow: hidden;
}
.agent-run-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.agent-run-icon { font-size: 18px; flex-shrink: 0; }
.agent-run-name { font-size: 13px; font-weight: 700; flex: 1; }
.agent-status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot-pending  { background: var(--muted); }
.dot-running  { background: var(--neutral); animation: pulse 1s infinite; }
.dot-done     { background: var(--bull); }
.dot-error    { background: var(--bear); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.agent-run-body {
  padding: 12px 14px;
  font-size: 12px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
  max-height: 400px; overflow-y: auto;
}
.agent-run-body.collapsed { display: none; }

.agent-run-ticker {
  font-size: 10px; color: var(--muted); font-weight: 600;
}

/* Run history strip */
.history-strip {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0;
  scrollbar-width: none;
}
.history-strip::-webkit-scrollbar { display: none; }
.hist-chip {
  flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.hist-chip:hover { border-color: var(--accent); color: var(--accent); }
.hist-chip.current { border-color: var(--accent); color: var(--accent); }
</style>
</head>

<!-- ── Header ───────────────────────────────────────────────────────────── -->
<header>
  <span class="logo">TA</span>
  <div class="ticker-wrap">
    <input id="ticker-input" type="text" placeholder="AAPL"

  </div>
  <div class="header-right">
    <span class="asset-badge" id="asset-badge">—</span>
    <span class="last-update" id="last-update">—</span>
  </div>
</header>

<!-- ── Main scrollable area ─────────────────────────────────────────────── -->
<main>

  <!-- ── Tab 1: Markets ─────────────────────────────────────────────────── -->
  <div id="tab-markets" class="tab-content active">

    <!-- Price hero -->
    <div class="card" id="price-card">
      <div class="card-title" id="price-card-title">Price</div>
      <div class="price-row">
        <div class="price-main" id="price-val">—</div>
        <div class="price-badge flat" id="price-change">—</div>

      <div class="price-sub" id="price-sub">Loading…</div>

    <!-- TradingView chart -->
    <div class="card chart-card">
      <div class="chart-controls">
        <span class="chart-label" id="chart-label">Chart · Daily</span>
        <button class="chart-btn" onclick="toggleChart(this)">&#8597; Expand</button>
      </div>
      <iframe id="tv-chart" scrolling="no" allowtransparency="true"
              allowfullscreen="" frameborder="0"></iframe>
    </div>

    <!-- Pivot levels -->
    <div class="card" id="pivot-card">
      <div class="card-title">Pivot Levels · Daily</div>
      <div id="pivot-body"><div class="skeleton" style="height:120px"></div></div>
    </div>

    <!-- Technical indicators -->
    <div class="card">
      <div class="card-title">Technical Indicators</div>
      <div class="ind-grid" id="ind-grid">
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
        <div class="skeleton" style="height:64px"></div>
      </div>
    </div>

    <!-- News -->
    <div class="card" id="news-card" style="margin-bottom:8px">
      <div class="card-title">News</div>
      <div id="news-body"><div class="skeleton" style="height:80px"></div></div>
    </div>

  </div><!-- /tab-markets -->

  <!-- ── Tab 2: Agents ──────────────────────────────────────────────────── -->
  <div id="tab-agents" class="tab-content">

    <!-- Config card -->
    <div class="card">
      <div class="card-title">Configure Run</div>
      <div class="agent-form">

        <!-- Date picker -->
        <div class="date-row">
          <label for="agents-date">Analysis date</label>
          <input type="date" id="agents-date">
        </div>

        <!-- Tier 1 analysts -->
        <div>
          <div class="tier-header">
            Analysts
            <span class="tier-badge tier1-badge">Tier 1 · instant</span>
          </div>
          <div class="agent-grid" id="analyst-chips">
            <!-- rendered by JS -->
          </div>
        </div>

        <button class="run-btn" id="agents-run-btn" onclick="submitAgentRun()">
          Run Selected Analysts
        </button>
      </div>
    </div>

    <!-- Run history -->
    <div class="card" id="agents-history-card" style="display:none">
      <div class="card-title" style="margin-bottom:6px">Recent Runs</div>
      <div class="history-strip" id="agents-history-strip"></div>
    </div>

    <!-- Output cards injected here by JS -->
    <div id="agents-output"></div>

  </div><!-- /tab-agents -->

  <!-- ── Tab 3: Analysis ────────────────────────────────────────────────── -->
  <div id="tab-analysis" class="tab-content">
    <div class="placeholder-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5

      <div class="placeholder-title">Analysis</div>

        Full 9-agent pipeline with bull/bear debate, risk management, and

</main>

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const API = window.location.origin;
const PRICE_INTERVAL_MS    = 6000;   // 6 s
const MARKETS_INTERVAL_MS  = 5 * 60 * 1000;  // 5 min

// ── State ─────────────────────────────────────────────────────────────────────
let _ticker      = (localStorage.getItem('ta_ticker') || 'AAPL').toUpperCase();
let _activeTab   = 'markets';
let _currentPrice = null;
let _chartExpanded = false;
let _priceTimer  = null;
let _marketsTimer = null;
let _pivotData   = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmt(n, decimals = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function fmtAge(pubStr) {
  try {
    const d = isNaN(pubStr) ? new Date(pubStr) : new Date(Number(pubStr) * 1000);
    const diff = Math.round((Date.now() - d) / 60000);
    if (diff < 60)   return diff + 'm ago';
    if (diff < 1440) return Math.round(diff / 60) + 'h ago';
    return Math.round(diff / 1440) + 'd ago';
  } catch { return ''; }
}

function detectAssetClass(t) {
  t = t.toUpperCase();
  const metals = new Set(['XAUUSD','XAGUSD','XPTUSD','XPDUSD']);
  if (metals.has(t) || t.endsWith('=F')) return 'metal';
  const cryptoBases = new Set(['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','DOT','AVAX','MATIC','LINK','LTC']);
  const base3 = t.endsWith('USD') ? t.slice(0,-3) : null;
  if (base3 && cryptoBases.has(base3)) return 'crypto';
  if (t.includes('-USD') || t.includes('-USDT')) return 'crypto';
  if (t.length === 6 && /^[A-Z]+$/.test(t)) return 'forex';
  const etfs = new Set(['SPY','QQQ','IWM','GLD','SLV','USO','XLE','XLF']);
  if (etfs.has(t)) return 'etf';
  return 'stock';
}

function tvSymbol(t) {
  t = t.toUpperCase();
  const metalMap = {
    XAUUSD:'OANDA:XAUUSD', XAGUSD:'OANDA:XAGUSD',
    XPTUSD:'OANDA:XPTUSD', XPDUSD:'OANDA:XPDUSD',
  };
  if (metalMap[t]) return metalMap[t];
  if (t.includes('-USD') && t.length > 7) {
    return 'COINBASE:' + t.replace('-','');
  }
  const forexPairs = ['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','NZDUSD'];
  if (forexPairs.includes(t)) return 'FX:' + t;
  return t; // TradingView auto-resolves stock tickers
}

function updateLastUpdate() {
  $('last-update').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

// ── API fetch ─────────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ── Ticker management ─────────────────────────────────────────────────────────
function applyTicker() {
  const raw = $('ticker-input').value.trim().toUpperCase();
  if (!raw) return;
  _ticker = raw;
  localStorage.setItem('ta_ticker', _ticker);
  $('ticker-input').value = _ticker;

  const ac = detectAssetClass(_ticker);
  $('asset-badge').textContent = ac;

  // Update TradingView chart
  updateChart();

  // Reset displays
  $('price-val').textContent = '—';
  $('price-change').textContent = '—';
  $('price-change').className = 'price-badge flat';
  $('price-sub').textContent = 'Loading…';
  $('price-card-title').textContent = _ticker;
  $('pivot-body').innerHTML = '<div class="skeleton" style="height:120px"></div>';
  $('ind-grid').innerHTML = Array(8).fill('<div class="skeleton" style="height:64px"></div>').join('');
  $('news-body').innerHTML = '<div class="skeleton" style="height:80px"></div>';

  // Reload all data
  loadAll();
}

// ── TradingView chart ─────────────────────────────────────────────────────────
function updateChart() {
  const sym = encodeURIComponent(tvSymbol(_ticker));
  const h   = _chartExpanded ? 600 : 380;
  $('tv-chart').style.height = h + 'px';
  $('tv-chart').src =
    `https://s.tradingview.com/widgetembed/?frameElementId=tv&symbol=${sym}` +
    `&interval=D&hidesidetoolbar=1&symboledit=0&saveimage=0` +
    `&toolbarbg=161b22&theme=dark&style=1&timezone=Etc%2FUTC` +
    `&studies=RSI%400&withdateranges=0&showpopupbutton=0`;
  $('chart-label').textContent = _ticker + ' · Daily';
}

function toggleChart(btn) {
  _chartExpanded = !_chartExpanded;
  $('tv-chart').style.height = (_chartExpanded ? 600 : 380) + 'px';
  btn.textContent = _chartExpanded ? '↕ Collapse' : '↕ Expand';
}

// ── Indicator signal ──────────────────────────────────────────────────────────
function indSignal(name, val, price) {
  if (val === null || val === undefined) return ['—', 'neutral-c'];
  const v = parseFloat(val);
  switch (name) {
    case 'rsi':
      if (v > 70) return ['Overbought', 'bear-c'];
      if (v < 30) return ['Oversold',   'bull-c'];
      return ['Neutral', 'neutral-c'];
    case 'stoch_k':
      if (v > 80) return ['Overbought', 'bear-c'];
      if (v < 20) return ['Oversold',   'bull-c'];
      return ['Neutral', 'neutral-c'];
    case 'macd': case 'macdh':
      return v > 0 ? ['Bullish', 'bull-c'] : v < 0 ? ['Bearish', 'bear-c'] : ['Neutral', 'neutral-c'];
    case 'close_50_sma': case 'close_200_sma': case 'close_10_ema':
    case 'boll': case 'boll_ub': case 'boll_lb':
      if (!price) return ['—', 'neutral-c'];
      return parseFloat(price) > v ? ['Price Above', 'bull-c'] : ['Price Below', 'bear-c'];
    case 'atr':
      return [fmt(v, 4), 'neutral-c'];
    default:
      return ['—', 'neutral-c'];
  }
}

// ── Render indicators ─────────────────────────────────────────────────────────
function renderIndicators(ind, price) {
  const defs = [
    { key: 'rsi',           label: 'RSI (14)',      dec: 1 },
    { key: 'stoch_k',       label: 'Stoch %K',      dec: 1 },
    { key: 'macd',          label: 'MACD',           dec: 4 },
    { key: 'macdh',         label: 'MACD Hist',      dec: 4 },
    { key: 'close_50_sma',  label: 'MA 50',          dec: 2 },
    { key: 'close_200_sma', label: 'MA 200',         dec: 2 },
    { key: 'close_10_ema',  label: 'EMA 10',         dec: 2 },
    { key: 'atr',           label: 'ATR (14)',        dec: 4 },
  ];

  $('ind-grid').innerHTML = defs.map(({ key, label, dec }) => {
    const val = ind[key];
    const [sigText, sigClass] = indSignal(key, val, price);
    const display = (val !== null && val !== undefined) ? fmt(val, dec) : '—';
    const color = sigClass === 'bull-c' ? 'var(--bull)'
                : sigClass === 'bear-c' ? 'var(--bear)'
                : 'var(--text)';
    return `<div class="ind-box">
      <div class="ind-name">${label}</div>
      <div class="ind-value" style="color:${color}">${display}</div>
      <div class="ind-signal ${sigClass}">${sigText}</div>
    </div>`;
  }).join('');
}

// ── Render pivots ─────────────────────────────────────────────────────────────
const _PIVOT_LEVELS = [
  { key: 'R3', color: '#ff4444' },
  { key: 'R2', color: '#ff7744' },
  { key: 'R1', color: '#ffaa44' },
  { key: 'P',  color: '#8b949e' },
  { key: 'S1', color: '#44aaff' },
  { key: 'S2', color: '#4488ff' },
  { key: 'S3', color: '#4444ff' },
];

function renderPivots(pivots, currentPrice) {
  if (!pivots || !Object.keys(pivots).length) {
    $('pivot-body').innerHTML = '<div class="error-msg">⚠ No pivot data</div>';
    return;
  }

  const prices = _PIVOT_LEVELS.map(l => pivots[l.key]).filter(Boolean);
  const minP = Math.min(...prices, currentPrice || Infinity) * 0.998;
  const maxP = Math.max(...prices, currentPrice || -Infinity) * 1.002;
  const range = maxP - minP || 1;

  // Merge current price row into sorted list
  const allLevels = [..._PIVOT_LEVELS.map(l => ({
    ...l, price: pivots[l.key], isNow: false,
  }))];
  if (currentPrice) {
    const insertIdx = allLevels.findIndex(l => l.price < currentPrice);
    allLevels.splice(insertIdx < 0 ? allLevels.length : insertIdx, 0, {
      key: 'NOW', color: '#c0c0c0', price: currentPrice, isNow: true,
    });
  }

  $('pivot-body').innerHTML = `<table class="pivot-table">${
    allLevels.map(l => {
      const pct = ((l.price - minP) / range * 100).toFixed(1);
      return `<tr class="${l.isNow ? 'pivot-now' : ''}">
        <td class="pivot-lbl" style="color:${l.color}">${l.key}</td>
        <td class="pivot-bar-cell">
          <div class="pivot-bar-wrap">
            <div class="pivot-bar-fill" style="width:${pct}%;background:${l.color}"></div>
          </div>
        </td>
        <td class="pivot-price" style="color:${l.color};${l.isNow?'font-size:15px':''}">${fmt(l.price,3)}</td>
      </tr>`;
    }).join('')
  }</table>`;
}

// ── Render news ───────────────────────────────────────────────────────────────
function renderNews(items) {
  if (!items || !items.length) {
    $('news-body').innerHTML = '<div class="error-msg">⚠ No news available</div>';
    return;
  }
  $('news-body').innerHTML = items.map(n => `
    <a class="news-item" href="${n.url}" target="_blank" rel="noopener noreferrer">
      <div class="news-title">${n.title}</div>
      <div class="news-meta">
        ${n.source ? `<span>${n.source}</span>` : ''}
        ${n.published ? `<span>${fmtAge(n.published)}</span>` : ''}
      </div>
    </a>`).join('');
}

// ── Data loaders ──────────────────────────────────────────────────────────────
async function loadPrice() {
  if (_activeTab !== 'markets') return;
  try {
    const d = await apiFetch(`/api/markets/price?ticker=${_ticker}`);
    _currentPrice = d.price;
    $('price-val').textContent = '$' + fmt(d.price, 2);
    $('price-val').style.transition = 'color .3s';
    $('price-val').style.color = 'var(--accent)';
    setTimeout(() => { $('price-val').style.color = 'var(--text)'; }, 400);

    // Re-render pivots with updated current price if we have pivot data
    if (_pivotData) renderPivots(_pivotData, _currentPrice);
  } catch (_) { /* silent — stale display is fine */ }
}

async function loadIndicators() {
  if (_activeTab !== 'markets') return;
  try {
    const today = new Date().toISOString().slice(0, 10);
    const d = await apiFetch(`/api/markets/indicators?ticker=${_ticker}&date=${today}`);
    renderIndicators(d.indicators, _currentPrice);
    updateLastUpdate();
  } catch (e) {
    $('ind-grid').innerHTML = `<div class="error-msg" style="grid-column:1/-1">⚠ ${e.message}</div>`;
  }
}

async function loadPivots() {
  if (_activeTab !== 'markets') return;
  try {
    const d = await apiFetch(`/api/markets/pivots?ticker=${_ticker}&interval=1d&days=90`);
    _pivotData = d.pivots;
    renderPivots(_pivotData, _currentPrice);
  } catch (e) {
    $('pivot-body').innerHTML = `<div class="error-msg">⚠ ${e.message}</div>`;
  }
}

async function loadNews() {
  if (_activeTab !== 'markets') return;
  try {
    const d = await apiFetch(`/api/markets/news?ticker=${_ticker}&limit=6`);
    renderNews(d.news);
  } catch (_) {
    $('news-body').innerHTML = '<div class="error-msg">⚠ News unavailable</div>';
  }
}

async function loadAll() {
  await loadPrice();
  // Fire the heavier calls in parallel
  await Promise.allSettled([loadIndicators(), loadPivots(), loadNews()]);
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  ['markets', 'agents', 'analysis'].forEach(t => {
    $('tab-' + t).classList.toggle('active', t === tab);
    $('btn-' + t).classList.toggle('active', t === tab);
  });
  _activeTab = tab;
  if (tab === 'agents') agentsOnVisible();
}

// ═══════════════════════════════════════════════════════════════════════════════
// TAB 2 — AGENTS
// ═══════════════════════════════════════════════════════════════════════════════

const _TIER1_DEFS = [
  { id: 'market',       label: 'Market Analyst',       icon: '📊', sub: 'Price action & tech' },
  { id: 'social',       label: 'Social Analyst',        icon: '💬', sub: 'Sentiment & social' },
  { id: 'news',         label: 'News Analyst',          icon: '📰', sub: 'Recent news events' },
  { id: 'fundamentals', label: 'Fundamentals Analyst',  icon: '📋', sub: 'Financials & ratios' },
];

const REPORT_MAP = {
  market:       'market_report',
  social:       'sentiment_report',
  news:         'news_report',
  fundamentals: 'fundamentals_report',
};

// State for Tab 2
let _agentSelected  = new Set();
let _agentSessionId = null;
let _agentWs        = null;
let _agentSessions  = [];   // history (most recent first)

function initAgentsTab() {
  // Set today's date as default
  const today = new Date().toISOString().slice(0, 10);
  $('agents-date').value = localStorage.getItem('ta_agents_date') || today;

  // Build agent chips
  $('analyst-chips').innerHTML = _TIER1_DEFS.map(a => `
    <label class="agent-chip" id="chip-${a.id}" onclick="toggleAgent('${a.id}')">
      <input type="checkbox" id="cb-${a.id}">
      <div class="agent-chip-icon">${a.icon}</div>
      <div>
        <div class="agent-chip-label">${a.label}</div>
        <div class="agent-chip-sub">${a.sub}</div>
      </div>
    </label>`).join('');
}

function toggleAgent(id) {
  if (_agentSelected.has(id)) _agentSelected.delete(id);
  else                         _agentSelected.add(id);
  $('chip-' + id).classList.toggle('selected', _agentSelected.has(id));
  $('agents-run-btn').disabled = _agentSelected.size === 0;
}

async function submitAgentRun() {
  if (_agentSelected.size === 0) return;
  const date = $('agents-date').value;
  if (!date) { alert('Please select an analysis date.'); return; }
  localStorage.setItem('ta_agents_date', date);

  $('agents-run-btn').disabled = true;
  $('agents-run-btn').textContent = 'Starting…';

  try {
    const resp = await fetch(API + '/api/agents/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticker:        _ticker,
        analysis_date: date,
        analysts:      [..._agentSelected],
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || resp.status);
    }
    const { session_id } = await resp.json();
    _agentSessionId = session_id;

    // Push to history
    _agentSessions.unshift({ session_id, ticker: _ticker, date, analysts: [..._agentSelected] });
    if (_agentSessions.length > 10) _agentSessions.pop();
    renderAgentsHistory();

    // Build empty output cards
    buildAgentOutputCards(session_id, _ticker, [..._agentSelected]);

    // Connect WebSocket
    connectAgentWs(session_id);

  } catch (e) {
    alert('Failed to start agent run: ' + e.message);
    $('agents-run-btn').disabled = false;
    $('agents-run-btn').textContent = 'Run Selected Analysts';
  }
}

function buildAgentOutputCards(sessionId, ticker, analysts) {
  const container = $('agents-output');
  container.innerHTML = '';

  for (const id of analysts) {
    const def = _TIER1_DEFS.find(d => d.id === id);
    if (!def) continue;
    const reportKey = REPORT_MAP[id];

    const card = document.createElement('div');
    card.className = 'agent-run-card';
    card.id = 'acard-' + id;
    card.innerHTML = `
      <div class="agent-run-header" onclick="toggleAgentCard('${id}')">
        <span class="agent-run-icon">${def.icon}</span>
        <div>
          <div class="agent-run-name">${def.label}</div>
          <div class="agent-run-ticker">${ticker} · ${sessionId.slice(0,8)}</div>
        </div>
        <div class="agent-status-dot dot-pending" id="adot-${id}"></div>
      </div>
      <div class="agent-run-body collapsed" id="abody-${id}">Waiting for agent to start…</div>
    `;
    container.appendChild(card);
  }
}

function toggleAgentCard(id) {
  const body = $('abody-' + id);
  body.classList.toggle('collapsed');
}

function setAgentDot(agentName, status) {
  // Map agent display name back to id
  const def = _TIER1_DEFS.find(d => d.label === agentName);
  if (!def) return;
  const dot = $('adot-' + def.id);
  if (!dot) return;
  dot.className = 'agent-status-dot dot-' + (status === 'running' ? 'running' : status === 'done' ? 'done' : status === 'error' ? 'error' : 'pending');
}

function setAgentReport(section, content) {
  // Map report section → agent id
  const id = Object.entries(REPORT_MAP).find(([, v]) => v === section)?.[0];
  if (!id) return;
  const body = $('abody-' + id);
  if (!body) return;
  body.textContent = content;
  body.classList.remove('collapsed');
}

function connectAgentWs(sessionId) {
  if (_agentWs) { _agentWs.close(); _agentWs = null; }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}`);
  _agentWs = ws;

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.type === 'agent_update') {
      setAgentDot(msg.agent, msg.status);
    } else if (msg.type === 'report_update') {
      setAgentReport(msg.section, msg.content);
    } else if (msg.type === 'done' || msg.type === 'error') {
      $('agents-run-btn').disabled = false;
      $('agents-run-btn').textContent = 'Run Selected Analysts';
      ws.close();
      _agentWs = null;
    } else if (msg.type === 'snapshot') {
      // Restore state from snapshot on reconnect
      if (msg.agent_status) {
        for (const row of msg.agent_status) setAgentDot(row.agent_name, row.status);
      }
      if (msg.reports) {
        for (const [sec, content] of Object.entries(msg.reports)) {
          if (content) setAgentReport(sec, content);
        }
      }
    }
  };

  ws.onerror = () => {};
  ws.onclose = () => { if (_agentWs === ws) _agentWs = null; };
}

function renderAgentsHistory() {
  const card = $('agents-history-card');
  const strip = $('agents-history-strip');
  if (!_agentSessions.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  strip.innerHTML = _agentSessions.map((s, i) =>
    `<div class="hist-chip${i === 0 ? ' current' : ''}"
          onclick="loadAgentSession('${s.session_id}')">
       ${s.ticker} · ${s.analysts.join('/')} · ${s.date.slice(5)}
     </div>`
  ).join('');
}

async function loadAgentSession(sessionId) {
  try {
    const d = await apiFetch(`/api/agents/run/${sessionId}`);
    const session = d.session;
    const analysts = session.config?.analysts || [];

    buildAgentOutputCards(sessionId, session.ticker, analysts.length ? analysts : Object.keys(REPORT_MAP));

    for (const row of d.agent_status || []) setAgentDot(row.agent_name, row.status);
    for (const [sec, content] of Object.entries(d.reports || {})) {
      if (content) setAgentReport(sec, content);
    }
    _agentSessionId = sessionId;
  } catch (e) { console.error('loadAgentSession', e); }
}

function agentsOnVisible() {
  // Keep run button in correct state
  $('agents-run-btn').disabled = _agentSelected.size === 0;
}

// ── Timer management ──────────────────────────────────────────────────────────
function startTimers() {
  clearInterval(_priceTimer);
  clearInterval(_marketsTimer);
  _priceTimer   = setInterval(loadPrice,   PRICE_INTERVAL_MS);
  _marketsTimer = setInterval(loadAll,     MARKETS_INTERVAL_MS);
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  $('ticker-input').value = _ticker;
  $('asset-badge').textContent = detectAssetClass(_ticker);
  $('price-card-title').textContent = _ticker;

  updateChart();
  loadAll();
  startTimers();
  initAgentsTab();

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

init();
</script>
